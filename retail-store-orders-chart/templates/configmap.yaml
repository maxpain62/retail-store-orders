apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.metadata.labels.app }}-configmap
data:
  RETAIL_ORDERS_MESSAGING_PROVIDER: rabbitmq
  RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES: {{ .Values.metadata.labels.app }}-rabbitmq-service:5672
  RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
  RETAIL_ORDERS_PERSISTENCE_ENDPOINT: {{ .Values.metadata.labels.app }}-postgresql-service:5432
  RETAIL_ORDERS_PERSISTENCE_NAME: orders